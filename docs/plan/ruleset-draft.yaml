schema_version: 1
id: uu-pdp-27-2022
version: 1.0.0-draft.1
status: draft
last_reviewed: 2026-11-05
reviewed_by: null

scope:
  id: >-
    Butir transparansi dan pengungkapan yang diharapkan dimuat dalam kebijakan
    privasi (pemberitahuan privasi) berdasarkan UU No. 27 Tahun 2022. Ruleset ini
    hanya menilai isi teks kebijakan, bukan praktik kepatuhan organisasi.
  en: >-
    Transparency and disclosure items a privacy policy (privacy notice) is
    expected to cover under Law No. 27 of 2022. The ruleset assesses only what
    the policy text says, not whether an organisation complies in practice.

instrument:
  key: UU-27-2022
  title_id: Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi
  title_en: Law of the Republic of Indonesia Number 27 of 2022 on Personal Data Protection (unofficial translation)
  enacted_on: 2022-10-17
  promulgated_on: 2022-10-17
  in_force_from: 2022-10-17          # Pasal 76, p. 33
  transition_ended_on: 2024-10-17    # Pasal 74, p. 33: 2 years after promulgation
  gazette: Lembaran Negara RI Tahun 2022 Nomor 196; Tambahan Lembaran Negara RI Nomor 6820
  court_decisions:
    - ref: Putusan Mahkamah Konstitusi Nomor 151/PUU-XXII/2024
      pronounced_on: 2025-07-30
      affects: p53-1
      effect_id: >-
        Kata "dan" dalam Pasal 53 ayat (1) huruf b bertentangan dengan UUD 1945 dan
        tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak
        dimaknai "dan/atau".
      effect_en: >-
        The word "dan" (and) in Article 53(1)(b) is conditionally unconstitutional
        unless read as "dan/atau" (and/or), so the DPO criteria are alternative.
      source: mk-151-2024
      verified_on: 2026-11-05
  implementing_regulations:
    - ref: Peraturan Pemerintah Nomor 33 Tahun 2026
      status: promulgated_not_in_force
      note_en: >-
        Reported as promulgated in July 2026 and entering into force about
        January 2027. Official copy not yet obtained, so it is not used by this
        ruleset. See docs/legal/SOURCES.md section 3.
      checked_on: 2026-11-05
    - ref: Peraturan Presiden tentang lembaga Pelindungan Data Pribadi (Pasal 58 ayat (5))
      status: not_enacted
      checked_on: 2026-11-05

