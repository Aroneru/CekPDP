# How to review
#   1. `provisions` is a catalogue of every legal text the rules cite. Each entry
#      was checked word for word against the page image of the official copy
#      (see docs/legal/SOURCES.md). `pdf_page` is the PDF page number.
#   2. Each rule has:
#        requirement_type  legal | best_practice
#        legal_mapping     direct | interpretive   (legal rules only)
#        status            active | needs_review   (needs_review = excluded from
