fixture: en-04-gdpr-style
title: Lingowave (language-learning app), GDPR-style English notice
language: en
ruleset_version: 1.0.0
description: >-
  A thorough GDPR-style notice that maps imperfectly onto UU PDP: retention is
  only "as long as necessary", erasure is offered without ending processing,
  the complaint right replaces the right to sue for compensation, requests take
  a month, breach notice is "without undue delay" (72 hours only to the
  authority, where required), and no Indonesian version is mentioned.

