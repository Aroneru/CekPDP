fixture: en-02-saas-comprehensive
title: Kanopi Workspace (B2B SaaS), strong English policy with typical gaps
language: en
ruleset_version: 1.0.0
description: >-
  A well-structured SaaS policy that still misses UU PDP specifics: purposes
  aren't linked to data categories, processing periods are given for only some
  purposes, there is no right to sue for compensation, requests take 14 days,
  breach notification has no timeframe, and business transfers carry no notice
  commitment.

