fixture: id-09-umkm-minim
title: Toko Roti Bu Sari (small bakery), minimal Indonesian notice
language: id
ruleset_version: 1.0.0
description: >-
  A four-sentence notice from a small business. It lists the data and its one
  purpose and names the only recipient (the courier), but says nothing about
  the legal basis, retention, rights, changes or security.

context:
  consent_basis: "yes"
  specific_data: "no"
  children: "no"
  international_transfer: "no"
  automated_decisions: "no"

