  PDP-ID-02: partially_addressed
  PDP-DATA-01: addressed
  PDP-DATA-02:
    status: addressed
    acceptable: [partially_addressed]
    note: >-
      All three data items are tied to a single stated purpose. A stricter
      reviewer could want the link spelled out per item.
  PDP-DATA-03: not_applicable
  PDP-DATA-04:
    status: addressed
    acceptable: [partially_addressed]
    note: >-
      Says the data is requested from the customer when ordering; no other
      collection method is apparent, though a website could also use cookies.
